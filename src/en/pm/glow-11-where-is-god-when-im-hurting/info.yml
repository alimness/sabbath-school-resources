title: Where Is God When I’m Hurting?
kind: book
subtitle: Giving Light to Our World
description: "The day begins. Any given day. A family of five starts a drive across town. The crash is sudden. Metal, plastic and flesh are torn apart. Three are dead, and two are severely injured. But the drunk driver in the speeding truck that hit them is merely bruised. Why?"
